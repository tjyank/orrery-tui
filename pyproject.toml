[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orrery-tui"
version = "0.1.0"
description = "Live isometric solar system in your terminal, driven by NASA/JPL Horizons ephemerides"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "truststore>=0.9",  # use the OS certificate store for HTTPS (corporate proxies, Windows)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orrery = "orrery.app:main"

[tool.setuptools]
packages = ["orrery"]
